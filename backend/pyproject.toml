[project]
name = "fieldshift"
version = "0.0.1"
description = "Field Shift v0: crop-rotation exploration for one field (NASA Space Apps 2026)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pyyaml>=6",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "numpy>=1.26",
  "pystac-client>=0.7",
  "planetary-computer>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
tools = ["scipy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fieldshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
