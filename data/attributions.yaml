# Data sources and attributions, shown in the app footer. One entry per dataset.
sources:
  - id: usda_cdl
    name: Cropland Data Layer (CDL)
    provider: USDA National Agricultural Statistics Service
    used_for: Crop history and crops grown in the area
    url: https://www.nass.usda.gov/Research_and_Science/Cropland/SARS1a.php
    licence: Public domain (US Government work)
    attribution: "USDA National Agricultural Statistics Service Cropland Data Layer. {years}. Published crop-specific data layer. USDA-NASS, Washington, DC."
  - id: cropscape
    name: CropScape web service
    provider: USDA NASS / George Mason University CSISS
    used_for: CDL files for Whitman County (all years after the Planetary Computer range, and fallback)
    url: https://nassgeodata.gmu.edu/CropScape/
    licence: Public domain (US Government work)
    attribution: "CDL data accessed through CropScape (Han et al., 2012)."
  - id: planetary_computer
    name: Microsoft Planetary Computer
    provider: Microsoft
    used_for: Hosting of CDL (2008–2021) and Sentinel-2 Level-2A
    url: https://planetarycomputer.microsoft.com/
    licence: Planetary Computer terms of use; each dataset keeps its own licence
    attribution: "Data accessed through the Microsoft Planetary Computer."
  - id: nasa_power
    name: NASA POWER daily point data
    provider: NASA Langley Research Center
    used_for: Rainfall and temperature (regional, about 50 km grid)
    url: https://power.larc.nasa.gov/
    licence: Free and open, no restrictions
    attribution: "These data were obtained from the NASA Langley Research Center (LaRC) POWER Project funded through the NASA Earth Science/Applied Science Program."
  - id: sentinel2
    name: Sentinel-2 Level-2A
    provider: European Space Agency, Copernicus programme
    used_for: Vegetation index (NDVI) for the field
    url: https://sentinels.copernicus.eu/
    licence: Copernicus Sentinel data terms (free, full and open)
    attribution: "Contains modified Copernicus Sentinel data {years}."
  - id: tiger
    name: TIGER/Line county boundaries (TIGERweb)
    provider: US Census Bureau
    used_for: Whitman County outline
    url: https://tigerweb.geo.census.gov/
    licence: Public domain (US Government work)
    attribution: "US Census Bureau, TIGER/Line."
  - id: esri_imagery
    name: World Imagery basemap
    provider: Esri
    used_for: Satellite basemap
    url: https://www.arcgis.com/home/item.html?id=10df2279f9684e4a9f6a7f08febac2a9
    licence: Esri terms of use
    attribution: "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
