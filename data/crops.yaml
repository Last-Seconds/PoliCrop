# Crop table: PROVISIONAL CONTENT.
#
# Only name, class codes and role are filled in. Every agronomic attribute is
# deliberately null: the team will fill them from vetted sources. Do NOT invent
# numbers here. The app reads this file at start-up; no code change is needed to
# edit it. Schema (each crop):
#
#   id            unique identifier (snake_case)
#   name          display name
#   class_codes   map of classification system -> list of codes for this crop.
#                 us_cdl = USDA Cropland Data Layer codes (checked against the
#                 official CropScape legend, see data/us/cdl_legend.json).
#                 Another country adds its own key; no code change needed.
#   role          one of the role ids in roles.yaml
#   pool          "if_grown_nearby" (default): only offered if the crop-type map
#                 shows it in the surrounding area; "always": always offered
#                 (cover crops, which the crop-type map cannot see).
#   season_window {start: "MM-DD", end: "MM-DD", spans_winter: true|false}
#                 sowing-to-harvest window; spans_winter=true means sown in the
#                 autumn before the harvest year. null -> the provisional default
#                 step window in settings.yaml is used.
#   water_need_mm         seasonal water need, mm          (null = unknown)
#   temperature_limits_c  {min: , max: } in degrees C      (null = unknown)
#   nitrogen_effect       e.g. "fixes" / "neutral" / "draws" or kg N/ha (null = unknown)
#   ground_cover          ground cover over the season      (null = unknown)
#   notes         free text shown to the user
provisional: true

