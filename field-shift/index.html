<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Shift · Palouse</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo">FS</div>
    <div>
      <h1>Field Shift <span class="muted">· Palouse (WA / ID)</span></h1>
      <p data-i18n="tagline"></p>
    </div>
  </div>
  <div class="top-right">
    <span class="badge-demo" data-i18n="demoBadge"></span>
    <div class="lang">
      <button data-lang="tr" class="on">TR</button><button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main class="layout">
  <!-- LEFT: controls -->
  <aside class="panel controls" id="controls">
    <section>
      <h2 data-i18n="secField"></h2>
      <p class="hint" data-i18n="fieldHint"></p>
      <div id="presets" class="presets"></div>
      <div class="coords" id="coords"></div>
    </section>

    <section>
      <h2 data-i18n="secPriorities"></h2>
      <div id="sliders"></div>
    </section>

    <section>
      <h2 data-i18n="secMode"></h2>
      <label class="switch">
        <input type="checkbox" id="droughtMode">
        <span class="slider"></span>
        <span class="switch-text" data-i18n="droughtMode"></span>
      </label>
      <p class="hint" data-i18n="droughtHint"></p>
    </section>

    <section>
      <h2 data-i18n="secConstraints"></h2>
      <p class="hint" data-i18n="constraintsHint"></p>
      <div id="constraints" class="checks"></div>
    </section>

    <section>
      <h2 data-i18n="secCurrent"></h2>
      <p class="hint" data-i18n="currentHint"></p>
      <div id="currentSelects" class="selects"></div>
    </section>

    <section>
      <h2 data-i18n="secUpload"></h2>
      <p class="hint" data-i18n="uploadHint"></p>
      <input type="file" id="fileInput" accept=".csv,.xlsx,.xls">
      <button class="link" id="tplBtn" data-i18n="downloadTemplate"></button>
      <div id="uploadMsg" class="hint"></div>
    </section>
  </aside>

  <!-- CENTER: map -->
  <section class="mapwrap">
    <div id="map"></div>
    <div class="maptools">
      <div class="layer-btns" id="layerBtns"></div>
      <div class="timeline">
        <button id="playBtn" class="play" aria-label="play">▶</button>
        <input type="range" id="monthRange" min="0" max="11" step="1" value="3">
        <span id="monthLabel" class="month"></span>
      </div>
      <label class="tree"><input type="checkbox" id="treeToggle"> <span data-i18n="treeToggle"></span></label>
    </div>
    <div class="legend" id="legend"></div>
    <div class="map-note" data-i18n="mapNote"></div>
  </section>

  <!-- RIGHT: results -->
  <aside class="panel results">
    <nav class="tabs" id="tabs">
      <button data-tab="strategies" class="on" data-i18n="tabStrategies"></button>
      <button data-tab="whatif" data-i18n="tabWhatIf"></button>
      <button data-tab="report" data-i18n="tabReport"></button>
    </nav>
    <div id="tab-strategies" class="tabpane on"></div>
    <div id="tab-whatif" class="tabpane"></div>
    <div id="tab-report" class="tabpane"></div>
  </aside>
</main>

<footer class="foot">
  <p data-i18n="disclaimer"></p>
  <p class="muted" data-i18n="planned"></p>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
